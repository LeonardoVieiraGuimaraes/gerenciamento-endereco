services:
  # 1. BANCO DE DADOS DA APLICAÇÃO (SQL Server 2022)
  sqldb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gerenc-sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD}
    # Sem "ports:" aqui de propósito — em produção o SQL Server só precisa ser
    # alcançável pelos outros containers na rede interna (gerenc-net), nunca
    # exposto na internet.
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - gerenc-net

  # 2. APLICAÇÃO C# ASP.NET CORE API
  backend-api:
    image: gerenciamento-endereco-backend
    container_name: gerenc-web
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8090:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqldb;Database=GerenciamentoEnderecoDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;
      - Keycloak__Authority=https://auth-enderecos.leoproti.com.br/realms/gerenciamento-endereco
      - Keycloak__ExternalHost=auth-enderecos.leoproti.com.br
      - Keycloak__ExternalScheme=https
      - Keycloak__InternalHost=keycloak:8080
      - Keycloak__ClientSecret=${KEYCLOAK_CLIENT_SECRET}
      - Keycloak__RequireHttpsMetadata=true
      - Keycloak__ValidateIssuer=true
      - KeycloakAdmin__BaseUrl=http://keycloak:8080
      - KeycloakAdmin__Realm=gerenciamento-endereco
      - KeycloakAdmin__ClientId=backend-admin-api
      - KeycloakAdmin__ClientSecret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
      - Logging__ShowPII=false
      # Ambiente de homologação: popula usuários e endereços de demonstração no
      # primeiro boot com o banco vazio. Desligar ao virar produção com dado real.
      - Seed__Enabled=true
    depends_on:
      - sqldb
      - keycloak
    networks:
      - gerenc-net

  # 3. BANCO DE DADOS DO KEYCLOAK (PostgreSQL)
  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d keycloak -U keycloak"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_database:/var/lib/postgresql/data
    networks:
      - gerenc-net

  # 4. SERVIDOR KEYCLOAK
  keycloak:
    build:
      context: ../auth-keycloak
      dockerfile: Dockerfile
      # Os client secrets entram só aqui, vindos dos segredos do GitHub — o
      # arquivo de realm versionado guarda apenas placeholders.
      args:
        APP_CSHARP_SECRET: ${KEYCLOAK_CLIENT_SECRET}
        BACKEND_ADMIN_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
    container_name: keycloak-gerenciamento-endereco
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Diferente do dev local: aqui o hostname público é servido via HTTPS de
      # verdade (TLS terminado no Cloudflare Tunnel), então strict-https fica
      # ligado e KC_PROXY_HEADERS informa o Keycloak pra confiar no
      # X-Forwarded-* que o túnel envia (senão ele gera links com esquema/host
      # errado).
      KC_HOSTNAME: auth-enderecos.leoproti.com.br
      KC_HOSTNAME_STRICT_HTTPS: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "8089:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - gerenc-net

volumes:
  sqldata:
  keycloak_database:

networks:
  gerenc-net:
    driver: bridge

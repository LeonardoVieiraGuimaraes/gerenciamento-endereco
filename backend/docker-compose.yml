services:
  # 1. BANCO DE DADOS DA APLICAÇÃO (SQL Server 2022)
  sqldb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gerenc-sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SuperSenha123!
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - gerenc-net

  # 2. APLICAÇÃO C# ASP.NET CORE API
  backend-api:
    image: gerenciamento-endereco-backend
    container_name: gerenc-web
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
      - "5001:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqldb;Database=GerenciamentoEnderecoDb;User Id=sa;Password=SuperSenha123!;TrustServerCertificate=True;
      - Keycloak__MetadataAddress=http://authentik-server:9000/application/o/gerenciamento-endereco/.well-known/openid-configuration
      - Keycloak__Authority=http://localhost:8089/application/o/gerenciamento-endereco/
      - Keycloak__InternalHost=authentik-server:9000
      - Keycloak__ExternalHost=localhost:8089
    depends_on:
      - sqldb
      - authentik-server
    networks:
      - gerenc-net

  # 3. BANCO DE DADOS DO AUTHENTIK (PostgreSQL 16)
  authentik-postgresql:
    image: postgres:16-alpine
    container_name: authentik-postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    environment:
      POSTGRES_PASSWORD: authentik_pass_2026
      POSTGRES_USER: authentik
      POSTGRES_DB: authentik
    volumes:
      - authentik_database:/var/lib/postgresql/data
    networks:
      - gerenc-net

  # 4. CACHE E FILA DO AUTHENTIK (Redis)
  authentik-redis:
    image: redis:alpine
    container_name: authentik-redis
    command: --save 60 1 --loglevel warning
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - authentik_redis_data:/data
    networks:
      - gerenc-net

  # 5. SERVIDOR DO AUTHENTIK (versão fixada em 2026.5.6. NOTA: essa linha de release tem um
  #    bug confirmado no RP-Initiated Logout quando post_logout_redirect_uri é enviado
  #    (https://github.com/goauthentik/authentik/issues/22904). Não fazer downgrade para
  #    contornar — a migração de schema do Postgres não é reversível. O workaround está
  #    no backend: AuthController.Logout não envia RedirectUri no SignOut.)
  authentik-server:
    image: ghcr.io/goauthentik/server:2026.5.6
    container_name: authentik-server
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: c3VwZXJzZWNyZXRhdXRoZW50aWtrZXlmb3JnZXJlbmNpYW1lbnRvZW5kZXJlY28yMDI2
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik_pass_2026
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_LISTEN__HTTP: 0.0.0.0:9000
      AUTHENTIK_LISTEN__HTTPS: 0.0.0.0:9443
    ports:
      - "8089:9000"
      - "8443:9443"
    volumes:
      - ../auth-authentik/blueprints:/blueprints/custom
      - ../auth-authentik/theme/custom.css:/web/dist/custom.css
      - ../auth-authentik/theme/logo.svg:/web/dist/assets/icons/custom-logo.svg
      - ../auth-authentik/theme/favicon.svg:/web/dist/assets/icons/custom-favicon.svg
    depends_on:
      authentik-postgresql:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    networks:
      - gerenc-net

  # 6. WORKER DO AUTHENTIK (versão fixada em 2026.5.6 — ver nota acima sobre o bug de logout)
  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.5.6
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: c3VwZXJzZWNyZXRhdXRoZW50aWtrZXlmb3JnZXJlbmNpYW1lbnRvZW5kZXJlY28yMDI2
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik_pass_2026
      AUTHENTIK_REDIS__HOST: authentik-redis
    user: "0:0"
    volumes:
      - ../auth-authentik/blueprints:/blueprints/custom
      - ../auth-authentik/theme/custom.css:/web/dist/custom.css
      - ../auth-authentik/theme/logo.svg:/web/dist/assets/icons/custom-logo.svg
      - ../auth-authentik/theme/favicon.svg:/web/dist/assets/icons/custom-favicon.svg
    depends_on:
      authentik-postgresql:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    networks:
      - gerenc-net

volumes:
  sqldata:
  authentik_database:
  authentik_redis_data:

networks:
  gerenc-net:
    driver: bridge

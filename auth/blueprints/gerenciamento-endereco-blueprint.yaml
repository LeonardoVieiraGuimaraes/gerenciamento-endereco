# Authentik Blueprint para o sistema Gerenciamento de Endereços
version: 1
metadata:
  name: Gerenciamento de Endereços Full Blueprint
entries:
  # 0. BRAND PADRÃO EM PT-BR
  # A única forma suportada de forçar o idioma da tela de login (flow executor) é via
  # atributo settings.locale do Brand padrão. Variáveis de ambiente como
  # AUTHENTIK_DEFAULT_LANGUAGE não existem no Authentik e não têm efeito nenhum.
  - model: authentik_brands.brand
    id: brand-default
    identifiers:
      domain: authentik-default
    attrs:
      default: true
      branding_title: "Gerenciamento de Endereços"
      branding_logo: "/static/dist/assets/icons/custom-logo.svg"
      branding_favicon: "/static/dist/assets/icons/custom-favicon.svg"
      branding_custom_css: |
        :root {
          --ak-accent: #2563eb;
          --ak-dark-background: #0b0f17;
          --ak-dark-background-light: #111827;
          --ak-dark-background-lighter: #1a2333;
          --ak-global--background-image: none;
        }

        /* Remove a foto de fundo padrão e o rodapé "Powered by authentik" —
           a aplicação tem identidade visual própria. */
        .pf-c-login {
          background-color: var(--ak-dark-background) !important;
          background-image: radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
                             radial-gradient(circle at 85% 85%, rgba(37, 99, 235, 0.12) 0%, transparent 45%) !important;
        }

        ak-brand-links {
          display: none !important;
        }
      attributes:
        settings:
          locale: "pt-BR"

  # 1. GRUPOS / PERFIS (ROLES)
  - model: authentik_core.group
    id: role-admin
    identifiers:
      name: ADMIN
    attrs:
      is_superuser: true

  - model: authentik_core.group
    id: role-usuario
    identifiers:
      name: USUARIO
    attrs:
      is_superuser: false

  # 2. USUÁRIOS COM IDIOMA PT-BR
  - model: authentik_core.user
    id: user-admin
    identifiers:
      username: admin
    attrs:
      name: Administrador Master
      email: leonardovieriaxy@gmail.com
      is_active: true
      is_superuser: true
      password: "270414"
      attributes:
        settings:
          locale: "pt-br"
      groups:
        - !KeyOf role-admin
        - !KeyOf role-usuario

  - model: authentik_core.user
    id: user-leonardo
    identifiers:
      username: leonardo
    attrs:
      name: Leonardo Guimaraes
      email: leonardovieriaxy@hotmail.com
      is_active: true
      is_superuser: false
      password: "270414"
      attributes:
        settings:
          locale: "pt-br"
      groups:
        - !KeyOf role-usuario

  # 2.1 TOKEN DE API PARA O BACKEND GERENCIAR USUÁRIOS (admin.manage-users)
  # Usado pelo AuthentikAdminService (backend .NET) para chamar /api/v3/core/users/
  # server-to-server, sem depender do access_token OIDC do usuário logado.
  - model: authentik_core.token
    id: token-backend-admin-api
    identifiers:
      identifier: backend-admin-api-token
    attrs:
      user: !KeyOf user-admin
      intent: api
      expiring: false
      key: "SWlaE_4uBN0SZ8WHQ-cMHZXhj4Qzh77ld95sKBupUNVhGyJ_LI9-Eg"
      description: "Token usado pelo backend ASP.NET (AuthentikAdminService) para gerenciar usuários via API"

  # 3. PROVEDOR OPENID CONNECT (OIDC)
  - model: authentik_providers_oauth2.oauth2provider
    id: gerenciamento-endereco-provider
    identifiers:
      name: gerenciamento-endereco-provider
    attrs:
      client_id: app-csharp
      client_secret: bcdbmbolTUjkbRc21tgKv7yuU8XZDk1E
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - matching_mode: regex
          url: ".*"
      property_mappings:
        - !Find [authentik_core.propertymapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
        - !Find [authentik_core.propertymapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
        - !Find [authentik_core.propertymapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
      sub_mode: user_username
      issuer_mode: per_provider
      include_claims_in_id_token: true

  # 3.1 TÍTULOS DOS FLOWS PADRÃO (campo de texto livre, não é string traduzida)
  - model: authentik_flows.flow
    identifiers:
      slug: default-authentication-flow
    attrs:
      title: "Gerenciamento de Endereços"

  - model: authentik_flows.flow
    identifiers:
      slug: default-user-settings-flow
    attrs:
      title: "Minha Conta"

  - model: authentik_flows.flow
    identifiers:
      slug: default-invalidation-flow
    attrs:
      title: "Até logo!"

  # 4. APLICAÇÃO
  - model: authentik_core.application
    id: gerenciamento-endereco-app
    identifiers:
      slug: gerenciamento-endereco
    attrs:
      name: Gerenciamento de Endereços
      provider: !KeyOf gerenciamento-endereco-provider



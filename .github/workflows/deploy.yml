name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  DEPLOY_PATH: /home/leonardovieiraxy/projetos/gerenciamento-endereco

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore GerenciamentoEndereco.Tests/GerenciamentoEndereco.Tests.csproj

      - name: Build
        run: dotnet build GerenciamentoEndereco.Tests/GerenciamentoEndereco.Tests.csproj --no-restore -c Release

      - name: Test
        run: dotnet test GerenciamentoEndereco.Tests/GerenciamentoEndereco.Tests.csproj --no-build -c Release

      - name: Vulnerable packages
        run: dotnet list backend/GerenciamentoEndereco.API.csproj package --vulnerable --include-transitive

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Cloudflare
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "Host ${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  UserKnownHostsFile /dev/null" >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Preparar diretório no servidor
        run: |
          ssh -o ProxyCommand="cloudflared access ssh --hostname %h" \
              ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }} \
              "mkdir -p ${{ env.DEPLOY_PATH }}"

      - name: Sincronizar código com o servidor
        run: |
          rsync -avz --delete \
            --exclude='.git' --exclude='bin' --exclude='obj' --exclude='**/bin' --exclude='**/obj' \
            -e "ssh -o ProxyCommand='cloudflared access ssh --hostname %h'" \
            ./ ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:${{ env.DEPLOY_PATH }}/

      - name: Escrever segredos de produção (.env)
        env:
          SQL_SA_PASSWORD: ${{ secrets.SQL_SA_PASSWORD }}
          KEYCLOAK_DB_PASSWORD: ${{ secrets.KEYCLOAK_DB_PASSWORD }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
          KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          ssh -o ProxyCommand="cloudflared access ssh --hostname %h" \
              ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }} \
              "cat > ${{ env.DEPLOY_PATH }}/.env && chmod 600 ${{ env.DEPLOY_PATH }}/.env" <<EOF
          SQL_SA_PASSWORD=$SQL_SA_PASSWORD
          KEYCLOAK_DB_PASSWORD=$KEYCLOAK_DB_PASSWORD
          KEYCLOAK_ADMIN_PASSWORD=$KEYCLOAK_ADMIN_PASSWORD
          KEYCLOAK_CLIENT_SECRET=$KEYCLOAK_CLIENT_SECRET
          KEYCLOAK_ADMIN_CLIENT_SECRET=$KEYCLOAK_ADMIN_CLIENT_SECRET
          SMTP_HOST=$SMTP_HOST
          SMTP_PORT=$SMTP_PORT
          SMTP_FROM=$SMTP_FROM
          SMTP_USER=$SMTP_USER
          SMTP_PASSWORD=$SMTP_PASSWORD
          EOF

      - name: Build e subir os containers
        run: |
          ssh -o ProxyCommand="cloudflared access ssh --hostname %h" \
              ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }} \
              "cd ${{ env.DEPLOY_PATH }} && docker compose -f docker-compose.prod.yml up -d --build"

      - name: Verificar saúde da aplicação
        run: |
          ssh -o ProxyCommand="cloudflared access ssh --hostname %h" \
              ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }} \
              "for i in \$(seq 1 20); do curl -sf --max-time 15 http://localhost:8090/health && exit 0; sleep 10; done; echo 'Health check falhou'; docker logs gerenc-web --tail 100; exit 1"

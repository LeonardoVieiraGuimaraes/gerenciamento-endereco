# O nome do projeto define o prefixo dos volumes. Fixo de proposito: sem isso,
# mover este arquivo de pasta criaria volumes novos e vazios.
name: gerenciamento-endereco

services:
  # 1. BANCO DE DADOS DA APLICAÇÃO (SQL Server 2022)
  sqldb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gerenc-sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SuperSenha123!
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - gerenc-net

  # 2. APLICAÇÃO C# ASP.NET CORE API
  backend-api:
    image: gerenciamento-endereco-backend
    container_name: gerenc-web
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
      - "5001:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqldb;Database=GerenciamentoEnderecoDb;User Id=sa;Password=SuperSenha123!;TrustServerCertificate=True;
      - Keycloak__MetadataAddress=http://keycloak:8080/realms/gerenciamento-endereco/.well-known/openid-configuration
      - Keycloak__Authority=http://localhost:8089/realms/gerenciamento-endereco
      - Keycloak__InternalHost=keycloak:8080
      - Keycloak__ExternalHost=localhost:8089
      - KeycloakAdmin__BaseUrl=http://keycloak:8080
      - KeycloakAdmin__Realm=gerenciamento-endereco
      - KeycloakAdmin__ClientId=backend-admin-api
      - KeycloakAdmin__ClientSecret=dev-backend-admin-secret-nao-usar-em-producao
    depends_on:
      - sqldb
      - keycloak
    networks:
      - gerenc-net

  # 3. BANCO DE DADOS DO KEYCLOAK (PostgreSQL)
  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d keycloak -U keycloak"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_pass_2026
    volumes:
      - keycloak_database:/var/lib/postgresql/data
    networks:
      - gerenc-net

  # 4. SERVIDOR KEYCLOAK — build local (Dockerfile em auth-keycloak/) com tema glassmorphism
  #    custom e o realm "gerenciamento-endereco" (client, roles, usuários) importado
  #    automaticamente no boot.
  keycloak:
    build:
      context: ./auth-keycloak
      dockerfile: Dockerfile
    container_name: keycloak-gerenciamento-endereco
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_pass_2026
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123
      # KC_HOSTNAME fica com o nome público (localhost:8089): o Keycloak usa esse
      # valor em TODAS as URLs que ele mesmo renderiza (inclusive o "action" do
      # formulário de login), então precisa ser o que o NAVEGADOR do usuário
      # consegue resolver. O backend-api, que precisa falar com o Keycloak
      # server-to-server (token exchange, JWKS), usa os endpoints internos
      # (keycloak:8080) montados manualmente em Program.cs — não pelo discovery
      # document, que só teria a versão pública.
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8089"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8089:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - gerenc-net

  # 5. CAPTURADOR DE E-MAIL (só desenvolvimento)
  #    Finge ser um servidor SMTP: aceita as mensagens que o Keycloak envia
  #    (recuperação de senha, verificação de e-mail) e as mostra numa caixa de
  #    entrada web, sem entregar nada de verdade. Evita depender de provedor
  #    externo para testar o fluxo — e evita disparar e-mail real por engano
  #    para os endereços fictícios da carga de demonstração.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: gerenc-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # caixa de entrada web
    networks:
      - gerenc-net

volumes:
  sqldata:
  keycloak_database:

networks:
  gerenc-net:
    driver: bridge

# Sobrescreve textos das telas de login do Keycloak.
#
# Só entram aqui as mensagens que valem reescrever. O resto vem do bundle pt_BR
# oficial, e o que ele não traduz permanece em inglês — lacuna do próprio
# Keycloak, não deste projeto.

# --- Recuperação de senha ---
#
# A mensagem original ("Você deverá receber um e-mail em breve com mais
# instruções") é deliberadamente ambígua: ela aparece igual quando a conta
# existe e quando não existe, para que ninguém consiga descobrir quem tem
# cadastro testando endereços — o que se chama enumeração de usuários.
#
# O efeito colateral é que quem digita o dado errado fica sem entender por que
# nada chegou. O texto abaixo mantém a ambiguidade (não confirma nem nega a
# existência da conta) e ainda assim orienta quem errou.
emailSentMessage=Se existir uma conta com esse usuário ou e-mail, as instruções chegarão em instantes. Não recebeu? Verifique a caixa de spam e se o dado digitado está correto.

# Complementa o bundle pt_BR do Admin Console do Keycloak (keycloak.v2/admin).
#
# O bundle oficial pt_BR traduz "welcome" ("Bem-vindo ao") mas NÃO traz a chave
# "introduction" — por isso a tela inicial do realm aparecia com o título em
# português e o parágrafo abaixo em inglês. Sobrescrevemos só o que falta;
# todo o resto continua vindo do bundle oficial.
#
# As chaves são as mesmas usadas pelo admin-ui (React) e podem ser conferidas em
# theme/keycloak.v2/admin/messages/messages_en.properties dentro do jar
# org.keycloak.keycloak-admin-ui-*.jar.

introduction=Para sair desta página e gerenciar este realm, use os itens do menu na barra de navegação à esquerda.

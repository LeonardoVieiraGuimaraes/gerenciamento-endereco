# Complementa o bundle pt_BR do Admin Console do Keycloak (keycloak.v2/admin).
#
# CONTEXTO: a tradução oficial para pt_BR está bem incompleta. No Keycloak
# 26.6.3, das 3.805 chaves existentes em inglês, apenas 1.148 têm tradução —
# cerca de 70% do console fica em inglês. É por isso que aparecem telas com o
# título traduzido e o conteúdo em inglês: não é erro de configuração deste
# projeto, é lacuna do bundle oficial.
#
# ESCOPO DESTE ARQUIVO: traduzir as telas efetivamente usadas na administração
# do sistema. Cobrir as 2.657 chaves restantes seria um trabalho de tradução
# contínuo, refeito a cada versão do Keycloak — desproporcional para o projeto.
#
# COMO ADICIONAR UMA CHAVE: o texto original está em
# theme/keycloak.v2/admin/messages/messages_en.properties, dentro do jar
# org.keycloak.keycloak-admin-ui-*.jar do container. Para listar o que falta:
#
#   docker cp <container>:/opt/keycloak/lib/lib/main/org.keycloak.keycloak-admin-ui-<versao>.jar .
#
# e comparar as chaves do arquivo em inglês com as do pt_BR.
#
# AO ATUALIZAR O KEYCLOAK: convém revisar este arquivo — chaves podem ser
# renomeadas ou ganhar tradução oficial, tornando a sobrescrita desnecessária.

# --- Tela inicial do realm ---
